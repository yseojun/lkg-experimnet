[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lkg-experiment"
version = "0.1.0"
description = "Looking Glass CoherentRaster experiment code kept separate from Bridge SDK"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "Pillow",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lkg_experiment*"]

[project.scripts]
lkg-run-coherent-raster = "lkg_experiment.coherent_default.run_coherent_raster_experiment:main"
lkg-build-web-index = "lkg_experiment.experiment.build_web_index:main"
lkg-open-experiment = "lkg_experiment.experiment.open_experiment:main"
lkg-build-lut-npz = "lkg_experiment.coherent_default.build_lut_npz:main"
lkg-render-looking-glass = "lkg_experiment.coherent_default.render_looking_glass:main"
lkg-batch-experiments = "lkg_experiment.experiment.batch_experiments:main"
lkg-generate-mapping-artifacts = "lkg_experiment.coherent_default.generate_mapping_artifacts:main"
lkg-rtgs-coherent = "lkg_experiment.rtgs_coherent.cli:main"
lkg-rtgs-basic-1view = "lkg_experiment.rtgs_coherent.basic_1view:main"
